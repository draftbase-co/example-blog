name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Draftbase webhook -> GitHub repository_dispatch rebuilds the site when content is published.
  # See the README; the token for that call lives in Draftbase, not in this repo.
  repository_dispatch:
    types: [draftbase-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          # Delivery-scoped, read-only. Read by Node during `astro build` and never
          # written into the generated HTML or JS.
          DRAFTBASE_API_KEY: ${{ secrets.DRAFTBASE_API_KEY }}
          # Optional. Empty falls back to "production".
          DRAFTBASE_ENVIRONMENT: ${{ vars.DRAFTBASE_ENVIRONMENT }}
          # Set by `npm create draftbase` when it wires up GitHub Pages; empty keeps the
          # config's own defaults.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
